name: Checks
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI tests with safe YAML support
        run: uv run --locked --no-editable --group test --extra mkdocs pytest -m "not integration"
      - name: Standard-library-only smoke test
        run: uv run --isolated --no-project plugins/docs-consistency-guard/skills/docs-consistency-guard/scripts/docs_guard.py --root examples/docs-consistency-guard/clean --format json
      - name: Installed entry point
        run: uv run --no-editable --extra mkdocs docs-consistency-guard --root examples/docs-consistency-guard/clean --format markdown
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
      - name: Verify selected, multiple and all Skills CLI installations
        run: uv run --locked --no-editable --group test --extra mkdocs pytest -m integration -v
